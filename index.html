<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exemple Authentification</title>
  <style>
    /* =======================
       Styles du conteneur Auth
       ======================= */
    #authOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center;
    }
    #authBox {
      background: #0c1420; padding: 20px; border-radius: 8px; width: 300px;
      color: #b0cbe0; font-family: Arial, sans-serif;
    }
    #authBox h2 { margin: 0 0 12px; text-align: center; }
    #authBox input {
      width: 100%; padding: 8px; margin: 6px 0;
      border: 1px solid #2a4058; border-radius: 4px; background: #162030; color: #fff;
    }
    #authBox button {
      width: 100%; padding: 10px; margin-top: 12px;
      background: #336699; border: none; border-radius: 4px; color: white;
      font-size: 1rem; cursor: pointer;
    }
    #authBox button:hover {
      background: #5588aa;
    }
    #authBox .error-msg {
      color: #ff6b6b; font-size: 0.85rem; text-align: center; min-height: 1.2em;
      margin-top: 8px;
    }
    #authBox .toggle-link {
      color: #7a96b0; font-size: 0.85rem; text-align: center;
      margin-top: 16px; cursor: pointer;
    }
    #authBox .toggle-link a {
      color: #7a96b0; text-decoration: none;
    }
    #authBox .toggle-link a:hover {
      text-decoration: underline;
    }
    .logout-btn {
      position: fixed; top: 16px; right: 20px;
      background: rgba(12, 20, 32, 0.8); border: 1px solid #2a4058;
      color: #b0cbe0; padding: 8px 18px; border-radius: 20px;
      font-family: Arial, sans-serif; cursor: pointer;
    }
    .logout-btn:hover {
      background: rgba(20, 30, 40, 0.9);
    }
    /* Autres styles (contenu principal masqué avant login) */
    #appContainer { display: none; margin: 20px; color: #fff; font-family: Arial, sans-serif; }
  </style>
</head>
<body>

  <!-- Overlay d'authentification -->
  <div id="authOverlay">
    <div id="authBox">
      <h2 id="authTitle">🔐 Login</h2>
      <form id="authForm">
        <input type="email" id="emailInput" placeholder="Email" required>
        <input type="password" id="passwordInput" placeholder="Mot de passe" required minlength="6">
        <div id="confirmPasswordGroup" style="display:none;">
          <input type="password" id="confirmPasswordInput" placeholder="Confirmer le mot de passe">
        </div>
        <button type="submit" id="authSubmitBtn">Login</button>
        <div id="authError" class="error-msg"></div>
      </form>
      <!-- Lien toggle statique -->
      <div class="toggle-link" id="toggleAuthLink">
        <span id="toggleMessage">Pas de compte ?</span>
        <a href="#" id="toggleText">Inscription</a>
      </div>
    </div>
  </div>

  <!-- Bouton Déconnexion (visible après login) -->
  <button id="logoutBtn" class="logout-btn" style="display:none;">🚪 Déconnexion</button>

  <!-- Contenu principal de l'application -->
  <div id="appContainer">
    <!-- Contenu de l'application (après authentification) -->
    <h1>Bienvenue dans l'application</h1>
    <!-- ... contenu interactif ... -->
    <p id="userEmail"></p>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <!-- Chargement de la librairie Supabase (CDN v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ---- Configuration Supabase ----
    // Remplacez les valeurs par vos propres URL et clé anon de Supabase
    const supabaseUrl = "https://VOTRE-PROJET.supabase.co";
    const supabaseAnonKey = "VOTRE_CLE_ANONYMATIQUE";
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    // ---- Références DOM ----
    const authOverlay    = document.getElementById('authOverlay');
    const authForm       = document.getElementById('authForm');
    const authTitle      = document.getElementById('authTitle');
    const authSubmitBtn  = document.getElementById('authSubmitBtn');
    const authError      = document.getElementById('authError');
    const toggleMessage  = document.getElementById('toggleMessage');
    const toggleText     = document.getElementById('toggleText');
    const confirmGroup   = document.getElementById('confirmPasswordGroup');
    const confirmInput   = document.getElementById('confirmPasswordInput');
    const logoutBtn      = document.getElementById('logoutBtn');
    const appContainer   = document.getElementById('appContainer');
    const userEmailField = document.getElementById('userEmail');

    // Mode actuel : true = login, false = signup
    let isLoginMode = true;

    // ---- Écouteur d'événement toggle (click sur le lien) ----
    toggleText.addEventListener('click', function(e) {
      e.preventDefault();
      // Bascule entre login <-> signup
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        // Passer en mode login
        authTitle.textContent = '🔐 Login';
        authSubmitBtn.textContent = 'Login';
        toggleMessage.textContent = 'Pas de compte ?';
        toggleText.textContent = 'Inscription';
        // Cacher champ de confirmation
        confirmInput.value = '';
        confirmGroup.style.display = 'none';
      } else {
        // Passer en mode inscription
        authTitle.textContent = '📝 Inscription';
        authSubmitBtn.textContent = 'Créer un compte';
        toggleMessage.textContent = 'Vous avez déjà un compte ?';
        toggleText.textContent = 'Connexion';
        // Afficher champ de confirmation
        confirmGroup.style.display = 'block';
        confirmInput.setAttribute('required', 'required');
      }
      // Effacer les messages d'erreur
      authError.textContent = '';
    });

    // ---- Écouteur du formulaire (submit) ----
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';  // effacer message

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      // Validation basique
      if (!email || !password) {
        authError.textContent = '❌ Veuillez remplir tous les champs.';
        return;
      }
      if (!isLoginMode) {
        // En mode inscription, vérifier la confirmation
        const confirmPwd = confirmInput.value;
        if (password !== confirmPwd) {
          authError.textContent = '❌ Les mots de passe ne correspondent pas.';
          return;
        }
      }

      try {
        let result;
        if (isLoginMode) {
          // --- LOGIN ---
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            authError.textContent = `❌ ${error.message}`;
            console.error('Login error:', error);
            return;
          }
          // Connexion réussie
          authOverlay.classList.add('hidden');
          appContainer.style.display = 'block';
          logoutBtn.style.display = 'inline-block';
          const userEmail = data.user ? data.user.email : null;
          userEmailField.textContent = `Connecté en tant que : ${userEmail}`;
          console.log('Connecté :', userEmail);
        } else {
          // --- SIGN UP ---
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) {
            authError.textContent = `❌ ${error.message}`;
            console.error('SignUp error:', error);
            return;
          }
          // Inscription réussie
          if (data.session) {
            // Confirme auto : utilisateur logué immédiatement
            authOverlay.classList.add('hidden');
            appContainer.style.display = 'block';
            logoutBtn.style.display = 'inline-block';
            const userEmail = data.user ? data.user.email : null;
            userEmailField.textContent = `Connecté en tant que : ${userEmail}`;
            console.log('Inscription réussie, connecté :', userEmail);
          } else {
            // Email confirmation required
            authError.textContent = '✅ Compte créé ! Veuillez confirmer votre email.';
            // Retour automatique en mode Login après délai
            setTimeout(() => {
              isLoginMode = true;
              authTitle.textContent = '🔐 Login';
              authSubmitBtn.textContent = 'Login';
              toggleMessage.textContent = 'Pas de compte ?';
              toggleText.textContent = 'Inscription';
              confirmGroup.style.display = 'none';
              authError.textContent = '✅ Vérifiez votre email, puis connectez-vous.';
            }, 2000);
          }
        }
      } catch (err) {
        console.error('Erreur inattendue :', err);
        authError.textContent = '❌ Erreur inattendue, réessayez.';
      }
    });

    // ---- Session automatique au chargement ----
    (async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user) {
        // L'utilisateur est déjà connecté
        authOverlay.classList.add('hidden');
        appContainer.style.display = 'block';
        logoutBtn.style.display = 'inline-block';
        userEmailField.textContent = `Connecté en tant que : ${session.user.email}`;
        console.log('Bienvenue à nouveau :', session.user.email);
      }
    })();

    // ---- Logout ----
    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      // Retour à l'écran de login
      authOverlay.classList.remove('hidden');
      appContainer.style.display = 'none';
      logoutBtn.style.display = 'none';
      console.log('Déconnecté');
      // Réinitialiser le formulaire
      authForm.reset();
      isLoginMode = true;
      authTitle.textContent = '🔐 Login';
      authSubmitBtn.textContent = 'Login';
      toggleMessage.textContent = 'Pas de compte ?';
      toggleText.textContent = 'Inscription';
      confirmGroup.style.display = 'none';
      authError.textContent = '';
    });

    // ---- (Optionnel) Gestion de PASSWORD_RECOVERY via onAuthStateChange ----
    // Exemple: redirection depuis email de réinitialisation
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        const newPassword = prompt("Entrez votre nouveau mot de passe :");
        if (newPassword) {
          supabase.auth.updateUser({ password: newPassword })
            .then(({ data, error }) => {
              if (error) {
                alert("Erreur lors de la mise à jour du mot de passe : " + error.message);
              } else {
                alert("Mot de passe réinitialisé avec succès !");
              }
            });
        }
      }
    });

  </script>

</body>
</html>
